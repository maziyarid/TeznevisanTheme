<!-- Check Circle Icon -->
<symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"></circle>
    <polyline points="9 12 11 14 15 10"></polyline>
</symbol>

<!-- Shield Check Icon -->
